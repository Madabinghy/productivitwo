name: productivitwo_v1
description: "Starter V1 for Productivitwo: local JSON storage, activities, timers, daily total."
publish_to: "none"
version: 1.0.4+436

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  flame: ^1.18.0 # prototype moteur de jeu (Le Monde) — évaluation
  flame_svg: ^1.11.0 # rendu des SVG existants dans le prototype Flame
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0
  share_plus: ^10.0.2
  uuid: ^4.4.2
  fl_chart: ^1.1.1
  collection: ^1.18.0
  confetti: ^0.7.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  purchases_flutter: ^8.0.0
  sign_in_with_apple: ^6.0.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.0
  http: ^1.2.0
  home_widget: ^0.6.0
  firebase_messaging: ^16.0.0
  webview_flutter: ^4.0.0
  app_links: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.2
  alarm: ^5.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
