name: productivitwo_v1
description: "Starter V1 for Productivitwo: local JSON storage, activities, timers, daily total."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0
  share_plus: ^10.0.2
  uuid: ^4.4.2
  fl_chart: ^1.1.1
  collection: ^1.18.0
  confetti: ^0.7.0
  firebase_core: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
