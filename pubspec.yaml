name: productivitwo_v1
description: "Starter V1 for Productivitwo: local JSON storage, activities, timers, daily total."
publish_to: "none"
version: 1.1.0+447

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0
  uuid: ^4.4.2
  fl_chart: ^1.1.1
  collection: ^1.18.0
  confetti: ^0.7.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  # ≥ 9.0.0 requis : embarque purchases-ios ≥ 5.33 (fix de compilation
  # PaywallColor sous les Xcode récents — le 5.32 cassait Xcode Cloud).
  purchases_flutter: ^10.12.0
  sign_in_with_apple: ^6.0.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.0
  http: ^1.2.0
  home_widget: ^0.6.0
  firebase_messaging: ^16.0.0
  webview_flutter: ^4.0.0
  app_links: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.2
  share_plus: ^10.1.0 # export sauvegarde (Mes données)
  file_selector: ^1.0.3 # restauration : choisir un fichier .json
  alarm: ^5.4.1
  google_fonts: ^6.2.1 # refonte Soft Pop : Fredoka (UI) + Space Mono (chiffres)
  wakelock_plus: ^1.4.0 # mode Enchaîner : l'écran reste allumé


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/iso/assets_pixel_50x50/
    - assets/sprites/
  # Police embarquée (iPhone) : sous iOS 27 la police du système ne rend plus
  # les graisses demandées. Six graisses statiques, allégées (latin, flèches, maths).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
