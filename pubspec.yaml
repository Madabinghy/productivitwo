name: productivitwo_v1
description: "Starter V1 for Productivitwo: local JSON storage, activities, timers, daily total."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0
  share_plus: ^10.0.2
  uuid: ^4.4.2
  fl_chart: ^1.1.1
  collection: ^1.18.0
  confetti: ^0.7.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^1.0.7
  purchases_flutter: ^8.0.0
  sign_in_with_apple: ^6.0.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
