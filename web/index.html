<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Productivitwo — Gérez vos projets, pilotés par l'IA">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Productivitwo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon SVG (couleurs Productivitwo) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Productivitwo — Projects</title>
  <link rel="manifest" href="manifest.json?v=2">

  <!-- Safari : déregistre tout service worker existant avant le chargement Flutter
       (évite que des fichiers obsolètes en cache bloquent le rendu CanvasKit) -->
  <script>
    if (/apple/i.test(navigator.vendor) && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <!-- Écran de chargement — masqué au premier frame Flutter -->
  <div id="_fl_load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07100D">
    <span style="color:#27C48F;font-family:sans-serif;font-size:15px">Chargement…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var d = document.getElementById('_fl_load'); if (d) d.remove();
    });
  </script>
</body>
</html>
