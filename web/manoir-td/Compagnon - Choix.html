<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ombrelune — La Chambre du Coffre (vanilla)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#070510; font-family:'Outfit',sans-serif; padding:24px; }
  @keyframes floaty { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-6px) } }
  @keyframes glowpulse { 0%,100%{ opacity:.4; transform:translate(-50%,-50%) scale(1) } 50%{ opacity:.8; transform:translate(-50%,-50%) scale(1.12) } }
  @keyframes hoodbob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-5px) } }
  @keyframes orbit1 { from{ transform: rotate(0) translateX(70px) rotate(0) } to{ transform: rotate(360deg) translateX(70px) rotate(-360deg) } }
  @keyframes fadein { from{ transform: translateY(6px) } to{ transform: none } }
  button{ font-family:'Outfit',sans-serif; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* OMBRELUNE — La Chambre du Coffre (choix du soir), 100% VANILLA JS */
(function(){
  'use strict';

  var FRAGMENTS = [
    { icon:'💧', name:'Boire de l\u2019eau', streak:6, violet:2 },
    { icon:'🍽️', name:'Faire la vaisselle', streak:12, violet:5 },
    { icon:'📖', name:'Lire 30 min', streak:4, violet:0 }
  ];
  var CHOICES = [
    { key:'open',  icon:'✦',  title:'Ouvrir le coffre', sub:'Vois tes intentions et accomplis-les pour sauver tes séries.', good:true },
    { key:'blow',  icon:'🕯️', title:'Souffler sa lanterne', sub:'Elle disparaît 1 h, puis revient te proposer le choix.' },
    { key:'sleep', icon:'🌙', title:'Te rendormir', sub:'Séries gardées en bougies violettes (max 5/routine).' }
  ];
  var candles = 7;

  var S = { phase:'plea' };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pick(key){ S.phase = key; render(); }
  function back(){ try { window.location.href = './index.html'; } catch(e){} }

  function pleaHTML(){
    var choices = CHOICES.map(function(c){
      var style = 'display:flex; align-items:center; gap:13px; width:100%; padding:13px 15px; border-radius:15px; cursor:pointer; text-align:left; border:1px solid '+(c.good?'rgba(214,168,74,.45)':'rgba(154,134,184,.22)')+'; background:'+(c.good?'linear-gradient(180deg, rgba(48,34,16,.8), rgba(28,18,8,.8))':'rgba(30,22,44,.6)')+'; box-shadow:'+(c.good?'0 10px 24px rgba(214,168,74,.18)':'none')+';';
      return '<button data-pick="'+c.key+'" style="'+style+'">'
        + '<span style="font-size:18px;">'+c.icon+'</span>'
        + '<span style="display:flex; flex-direction:column; align-items:flex-start; text-align:left; flex:1;">'
        +   '<span style="font-weight:700; font-size:13.5px; color:'+(c.good?'#f3cd72':'#ecdfc6')+';">'+esc(c.title)+'</span>'
        +   '<span style="font-weight:500; font-size:11px; line-height:1.35; color:#9a86b8; margin-top:1px;">'+esc(c.sub)+'</span>'
        + '</span></button>';
    }).join('');
    return '<div style="position:relative; flex:1; display:flex; flex-direction:column; align-items:center; padding:4px 22px 20px; animation:fadein .5s ease both;">'
      + '<div style="position:relative; width:100%; height:218px; display:flex; align-items:center; justify-content:center;">'
      +   '<div style="position:absolute; left:24px; top:16px; width:64px; height:74px; animation:hoodbob 3.6s ease-in-out infinite;">'
      +     '<div style="position:absolute; inset:-8px; border-radius:50%; background:radial-gradient(circle, rgba(140,90,200,.4), transparent 68%);"></div>'
      +     '<div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:60px; border-radius:50% 50% 46% 46% / 60% 60% 40% 40%; background:linear-gradient(180deg,#3a2c52,#1d1330); border:1.5px solid rgba(154,120,200,.6); box-shadow:0 0 22px rgba(120,80,190,.5);"></div>'
      +     '<div style="position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); width:15px; height:7px; border-radius:50%; background:radial-gradient(circle,#d9b3ff,#7a46c8); box-shadow:0 0 14px rgba(180,120,255,.9);"></div>'
      +   '</div>'
      +   '<div style="position:relative; width:140px; height:118px; display:flex; align-items:center; justify-content:center; animation:floaty 6s ease-in-out infinite;">'
      +     '<div style="position:absolute; left:50%; top:50%; width:206px; height:206px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(214,168,74,.32), transparent 66%); animation:glowpulse 4.5s ease-in-out infinite;"></div>'
      +     '<div style="position:relative; width:120px; height:92px; border-radius:13px; background:linear-gradient(180deg, #2a1d3e, #1a1126); border:2px solid rgba(214,168,74,.6); box-shadow:0 14px 30px rgba(0,0,0,.55), 0 0 26px rgba(214,168,74,.24);">'
      +       '<div style="position:absolute; top:0; left:0; right:0; height:31px; border-radius:11px 11px 0 0; background:linear-gradient(180deg, #36264e, #241733); border-bottom:1px solid rgba(214,168,74,.3);"></div>'
      +       '<div style="position:absolute; top:23px; left:50%; transform:translateX(-50%); width:20px; height:24px; border-radius:5px; background:radial-gradient(circle at 50% 38%, #ffe9b0, #d6a84a); box-shadow:0 0 16px rgba(240,185,78,.7);"></div>'
      +     '</div>'
      +     '<div style="position:absolute; left:50%; top:50%; width:13px; height:13px; margin:-6px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #ffe9b0, #d6a84a); box-shadow:0 0 13px rgba(242,205,114,.9); animation:orbit1 11s linear infinite;"></div>'
      +     '<div style="position:absolute; left:50%; top:50%; width:11px; height:11px; margin:-5px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #ffe9b0, #d6a84a); box-shadow:0 0 13px rgba(242,205,114,.9); animation:orbit1 11s linear infinite -3.6s;"></div>'
      +     '<div style="position:absolute; left:50%; top:50%; width:11px; height:11px; margin:-5px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #ffe9b0, #d6a84a); box-shadow:0 0 13px rgba(242,205,114,.9); animation:orbit1 11s linear infinite -7.3s;"></div>'
      +   '</div>'
      + '</div>'
      + '<div style="text-align:center;">'
      +   '<div style="font-weight:700; font-size:9px; letter-spacing:2.2px; text-transform:uppercase; color:#a07fce;">3 routines vont perdre leur série</div>'
      +   '<div style="margin-top:8px; font-family:\'Fraunces\',serif; font-weight:500; font-size:17px; line-height:1.34; color:#e7dcf0; font-style:italic;">« Tu n\'as pas tout fait aujourd\'hui… Laisse-moi garder tes séries au chaud. Tu verras demain. »</div>'
      + '</div>'
      + '<div style="margin-top:auto; width:100%; display:flex; flex-direction:column; gap:9px;">'+choices+'</div>'
      + '</div>';
  }

  function openHTML(){
    var frags = FRAGMENTS.map(function(fr){
      return '<div style="display:flex; align-items:center; gap:13px; padding:14px 15px; border-radius:14px; background:rgba(40,28,60,.55); border:1px solid rgba(214,168,74,.22);">'
        + '<span style="font-size:22px;">'+fr.icon+'</span>'
        + '<span style="flex:1; display:flex; flex-direction:column;"><span style="font-weight:700; font-size:14px; color:#fbf3e2;">'+esc(fr.name)+'</span><span style="font-weight:500; font-size:11px; color:#9a86b8;">Série de '+fr.streak+' jours en jeu</span></span>'
        + '<span style="font-weight:700; font-size:11px; color:#9fe0b0; padding:5px 10px; border-radius:999px; background:rgba(95,184,126,.12); border:1px solid rgba(95,184,126,.3);">À faire</span></div>';
    }).join('');
    return '<div style="position:relative; flex:1; display:flex; flex-direction:column; padding:18px 24px 22px; animation:fadein .5s ease both;">'
      + '<div style="font-weight:700; font-size:10px; letter-spacing:2.2px; text-transform:uppercase; color:#f2cd72;">Le coffre s\'ouvre · tes intentions</div>'
      + '<div style="margin-top:8px; font-family:\'Fraunces\',serif; font-weight:600; font-size:22px; line-height:1.18; color:#fbf3e2;">Accomplis-les pour sauver tes séries.</div>'
      + '<div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">'+frags+'</div>'
      + '<button data-act="back" style="margin-top:auto; width:100%; padding:15px; border:none; border-radius:15px; cursor:pointer; font-weight:800; font-size:14px; color:#1c1206; background:linear-gradient(180deg, #f2cd72, #d6a84a); box-shadow:0 12px 28px rgba(214,168,74,.3);">Au front ✦</button>'
      + '</div>';
  }

  function blowHTML(){
    return '<div style="position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 28px; text-align:center; animation:fadein .55s ease both;">'
      + '<div style="font-size:60px; filter:drop-shadow(0 0 16px rgba(150,110,230,.5));">💨</div>'
      + '<div style="margin-top:18px; font-weight:700; font-size:10px; letter-spacing:2.4px; text-transform:uppercase; color:#b79ae0;">Lanterne soufflée</div>'
      + '<div style="margin-top:10px; font-family:\'Fraunces\',serif; font-weight:600; font-size:24px; line-height:1.18; color:#fbf3e2; max-width:300px;">Elle recule dans l\'ombre.</div>'
      + '<div style="margin-top:13px; font-size:13.5px; line-height:1.55; color:#bcaccf; max-width:300px;">Elle te laisse <b style="color:#e7c878;">1 heure</b>. Pas une de plus — ensuite elle reviendra te proposer le même choix. À toi d\'agir d\'ici là.</div>'
      + '<button data-act="back" style="margin-top:26px; padding:15px 26px; border:none; border-radius:15px; cursor:pointer; font-weight:800; font-size:14px; color:#1c1206; background:linear-gradient(180deg, #f2cd72, #d6a84a); box-shadow:0 12px 28px rgba(214,168,74,.3);">Gagner du temps</button>'
      + '</div>';
  }

  function sleepHTML(){
    var rows = FRAGMENTS.map(function(f){
      var broke = f.violet >= 5;
      var nv = broke ? f.violet : f.violet + 1;
      var slots = [0,1,2,3,4].map(function(i){
        var st = 'width:9px; height:13px; border-radius:3px; background:'+(i<nv?'linear-gradient(180deg,#c89bff,#7a46c8)':'transparent')+'; border:'+(i<nv?'1px solid rgba(180,140,240,.7)':'1px solid rgba(120,100,150,.35)')+'; box-shadow:'+((i===nv-1&&!broke)?'0 0 8px rgba(180,120,255,.9)':'none')+';';
        return '<span style="'+st+'"></span>';
      }).join('');
      return '<div style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:'+(broke?'rgba(70,26,40,.5)':'rgba(40,28,60,.5)')+'; border:1px solid '+(broke?'rgba(224,85,106,.4)':'rgba(154,120,200,.28)')+';">'
        + '<span style="font-size:20px; filter:'+(broke?'grayscale(.5) opacity(.7)':'none')+';">🕯️</span>'
        + '<span style="flex:1; display:flex; flex-direction:column;"><span style="font-weight:700; font-size:13.5px; color:'+(broke?'#e6a0ac':'#ecdcf2')+';">'+(broke?'Une série se brise':'Une série gelée')+'</span><span style="font-weight:600; font-size:10.5px; color:'+(broke?'#e0556a':'#b79ae0')+'; margin-top:1px;">'+(broke?'Quota de 5 violettes dépassé':nv+'/5 bougies violettes')+'</span></span>'
        + '<span style="display:flex; gap:3px;">'+slots+'</span></div>';
    }).join('');
    return '<div style="position:relative; flex:1; display:flex; flex-direction:column; padding:18px 24px 22px; animation:fadein .5s ease both;">'
      + '<div style="font-weight:700; font-size:10px; letter-spacing:2.2px; text-transform:uppercase; color:#a07fce;">Tu te rendors · séries gelées</div>'
      + '<div style="margin-top:8px; font-family:\'Fraunces\',serif; font-weight:600; font-size:21px; line-height:1.18; color:#fbf3e2;">Une bougie violette par routine.</div>'
      + '<div style="margin-top:14px; display:flex; flex-direction:column; gap:9px;">'+rows+'</div>'
      + '<div style="margin-top:14px; font-family:\'Fraunces\',serif; font-style:italic; font-size:12.5px; line-height:1.5; color:#b79ae0; text-align:center;">« Ah… je ne t\'avais pas dit ? Au-delà de 5 bougies violettes, la série tombe pour de bon. Tu pourras en racheter une contre deux normales — mais avant le prochain choix. »</div>'
      + '<button data-act="back" style="margin-top:auto; width:100%; padding:15px; border:1px solid rgba(154,134,184,.4); border-radius:15px; cursor:pointer; font-weight:700; font-size:14px; color:#b79ae0; background:rgba(40,30,58,.6);">Bonne nuit…</button>'
      + '</div>';
  }

  function view(){
    var p = S.phase;
    var bg = p==='sleep'
      ? 'radial-gradient(120% 70% at 50% 28%, #1a1330 0%, #0e0a1c 52%, #060410 100%)'
      : 'radial-gradient(120% 70% at 50% 22%, #241a3a 0%, #140d20 52%, #0a0712 100%)';
    var body = p==='open' ? openHTML() : p==='blow' ? blowHTML() : p==='sleep' ? sleepHTML() : pleaHTML();
    return '<div style="position:relative; width:390px; height:820px; border-radius:40px; overflow:hidden; background:'+bg+'; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(196,160,84,.18) inset; display:flex; flex-direction:column; transition:background .8s ease;">'
      + '<div style="position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:20px 24px 0;">'
      +   '<div style="display:flex; flex-direction:column;"><span style="font-family:\'Fraunces\',serif; font-weight:600; font-size:14px; color:#e9dcc2;">La Chambre du Coffre</span><span style="font-weight:700; font-size:8.5px; letter-spacing:1.8px; text-transform:uppercase; color:#b79ae0; margin-top:2px;">Le choix du soir · dès 17h</span></div>'
      +   '<div style="display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:rgba(214,168,74,.1); border:1px solid rgba(214,168,74,.28);"><span style="font-size:11px;">🕯️</span><span style="font-weight:700; font-size:12px; color:#f2cd72;">'+candles+'</span></div>'
      + '</div>'
      + body
      + '</div>';
  }

  var app = document.getElementById('app');
  app.addEventListener('click', function(ev){
    var pk = ev.target.closest('[data-pick]');
    if(pk){ pick(pk.getAttribute('data-pick')); return; }
    var bk = ev.target.closest('[data-act="back"]');
    if(bk){ back(); }
  });
  function render(){ app.innerHTML = view(); }
  render();
})();
</script>
</body>
</html>
