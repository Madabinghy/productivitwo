<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ombrelune — Mode Évasion (vanilla)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0710; font-family:'Outfit',sans-serif; padding:24px; }
  @keyframes floaty { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-5px) } }
  @keyframes glowpulse { 0%,100%{ opacity:.4; transform:translate(-50%,-50%) scale(1) } 50%{ opacity:.8; transform:translate(-50%,-50%) scale(1.12) } }
  @keyframes flick { 0%,100%{ transform: translate(-50%,-50%) scaleY(1); opacity:1 } 50%{ transform: translate(-50%,-50%) scaleY(.82); opacity:.85 } }
  @keyframes ringpulse { 0%{ box-shadow:0 0 0 0 rgba(214,168,74,.5) } 100%{ box-shadow:0 0 0 16px rgba(214,168,74,0) } }
  @keyframes keyglow { 0%,100%{ filter:drop-shadow(0 0 6px rgba(242,205,114,.7)) } 50%{ filter:drop-shadow(0 0 14px rgba(242,205,114,1)) } }
  button{ font-family:'Outfit',sans-serif; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* OMBRELUNE — Mode Évasion (ascension des salles), 100% VANILLA JS */
(function(){
  'use strict';

  var ROOMS = [
    { icon:'🚪', name:'Le Vestibule', gateIcon:'', gate:'' },
    { icon:'📖', name:'La Bibliothèque', gateIcon:'', gate:'' },
    { icon:'🖼️', name:'La Galerie des ombres', gateIcon:'💧', gate:'Bois un verre d\u2019eau' },
    { icon:'🔭', name:'L\u2019Observatoire', gateIcon:'', gate:'' },
    { icon:'🗝️', name:'La Salle du Coffre', gateIcon:'', gate:'' }
  ];

  var S = { progress: 2 };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function goDoors(){ window.location.href = './Compagnon - Choix de profil.html'; }
  function doIt(){ S.progress = Math.min(S.progress + 1, ROOMS.length - 1); render(); }
  function later(){ /* la porte se rescelle : hook tentation à brancher */ }

  function view(){
    var p = S.progress;
    var cur = ROOMS[p] || ROOMS[ROOMS.length-1];
    var depthNames = ['au seuil du manoir','dans les premières salles','au cœur des couloirs','près du sanctuaire','au seuil du Coffre'];

    var ordered = ROOMS.map(function(r,idx){ return { r:r, idx:idx }; }).reverse();
    var rooms = ordered.map(function(o){
      var r=o.r, idx=o.idx;
      var cleared = idx < p, current = idx === p, locked = idx > p, isHeart = idx === ROOMS.length-1;
      var spine = cleared?'rgba(214,168,74,.5)':current?'linear-gradient(180deg, rgba(214,168,74,.5), rgba(154,134,184,.18))':'rgba(154,134,184,.16)';
      var nodeBg = cleared?'linear-gradient(180deg,#3a2a14,#241808)':current?'linear-gradient(180deg,#3a2750,#241636)':'linear-gradient(180deg,#1a1326,#120b1c)';
      var nodeBorder = cleared?'1.5px solid rgba(214,168,74,.6)':current?'1.5px solid rgba(214,168,74,.7)':'1.5px solid rgba(154,134,184,.18)';
      var nodeShadow = current?'0 0 22px rgba(214,168,74,.3)':cleared?'0 0 12px rgba(214,168,74,.18)':'none';
      var iconFilter = locked?'grayscale(1) opacity(.4)':'none';
      var cardBg = current?'linear-gradient(180deg, rgba(42,28,62,.9), rgba(24,15,36,.92))':'transparent';
      var cardBorder = current?'1px solid rgba(214,168,74,.3)':'1px solid transparent';
      var tagColor = cleared?'#c9a456':current?'#e7c878':(isHeart?'#b79ae0':'#6f6088');
      var nameColor = locked?'#6f6088':'#fbf3e2';
      var tag = cleared?'Salle franchie':current?'Porte actuelle':(isHeart?'Le cœur':'Salle scellée');
      var gateBlock = current
        ? '<div style="margin-top:7px; display:flex; align-items:center; gap:7px; padding:7px 10px; border-radius:10px; background:rgba(214,168,74,.12); border:1px solid rgba(214,168,74,.3);"><span style="font-size:14px;">'+r.gateIcon+'</span><span style="font-weight:600; font-size:11.5px; color:#e7c878;">'+esc(r.gate)+'</span></div>'
        : '';
      var ring = current ? '<div style="position:absolute; inset:0; border-radius:16px; animation:ringpulse 2s ease-out infinite;"></div>' : '';
      return '<div style="position:relative; display:flex; align-items:center; gap:15px; padding:7px 0;">'
        + '<div style="position:absolute; left:27px; top:0; bottom:0; width:2px; background:'+spine+';"></div>'
        + '<div style="position:relative; z-index:2; width:56px; height:56px; flex:none; border-radius:16px; display:flex; align-items:center; justify-content:center; background:'+nodeBg+'; border:'+nodeBorder+'; box-shadow:'+nodeShadow+';"><div style="font-size:23px; filter:'+iconFilter+';">'+r.icon+'</div>'+ring+'</div>'
        + '<div style="flex:1; padding:11px 14px; border-radius:14px; background:'+cardBg+'; border:'+cardBorder+';"><div style="font-weight:700; font-size:9px; letter-spacing:1.4px; text-transform:uppercase; color:'+tagColor+';">'+tag+'</div><div style="margin-top:3px; font-family:\'Fraunces\',serif; font-weight:600; font-size:16px; color:'+nameColor+';">'+esc(r.name)+'</div>'+gateBlock+'</div>'
        + '</div>';
    }).join('');

    return '<div style="position:relative; width:390px; height:820px; border-radius:40px; overflow:hidden; background:radial-gradient(120% 70% at 50% -6%, #241a3c 0%, #160d22 48%, #0a0712 100%); box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(196,160,84,.18) inset; display:flex; flex-direction:column;">'
      + '<div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:22px 22px 0;">'
      +   '<div data-act="goDoors" style="display:flex; flex-direction:column; cursor:pointer;"><span style="font-family:\'Fraunces\',serif; font-weight:600; font-size:15px; color:#e9dcc2;">Ombrelune</span><span style="font-weight:700; font-size:9px; letter-spacing:1.8px; text-transform:uppercase; color:#b79ae0; margin-top:2px;">‹ Mode évasion</span></div>'
      +   '<div style="display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:rgba(214,168,74,.1); border:1px solid rgba(214,168,74,.28);"><span style="font-size:13px; animation:keyglow 2.4s ease-in-out infinite;">🗝️</span><span style="font-weight:700; font-size:13px; color:#f2cd72;">'+p+'</span><span style="font-weight:500; font-size:11px; color:#c9a456;">fragments</span></div>'
      + '</div>'
      + '<div style="position:relative; padding:16px 24px 6px;"><div style="font-family:\'Fraunces\',serif; font-weight:600; font-size:21px; line-height:1.2; color:#fbf3e2;">Tu es '+esc(depthNames[p]||depthNames[depthNames.length-1])+'.</div><div style="margin-top:5px; font-size:12.5px; line-height:1.5; color:#a796c0;">Chaque porte s\'ouvre dans la vraie vie. Avance vers le cœur du manoir.</div></div>'
      + '<div style="position:relative; flex:1; overflow:hidden; padding:6px 0 0;">'
      +   '<div style="position:absolute; inset:0; overflow-y:auto; padding:14px 26px 18px;">'+rooms+'</div>'
      +   '<div style="position:absolute; top:0; left:0; right:0; height:24px; background:linear-gradient(180deg, #160d22, transparent); pointer-events:none;"></div>'
      + '</div>'
      + '<div style="position:relative; padding:14px 24px 30px; background:linear-gradient(180deg, transparent, rgba(8,5,14,.6) 30%);">'
      +   '<div style="display:flex; align-items:center; gap:13px; padding:14px 16px; border-radius:18px; background:linear-gradient(180deg, rgba(40,26,60,.92), rgba(22,14,34,.95)); border:1px solid rgba(214,168,74,.3); box-shadow:0 16px 40px rgba(0,0,0,.5);">'
      +     '<div style="position:relative; width:46px; height:46px; flex:none; display:flex; align-items:center; justify-content:center;">'
      +       '<div style="position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%; background:radial-gradient(circle, rgba(214,168,74,.4), transparent 68%); animation:glowpulse 3.6s ease-in-out infinite;"></div>'
      +       '<div style="position:relative; width:36px; height:42px; border-radius:20px 20px 16px 16px; background:linear-gradient(180deg,#22142f,#160c22); border:1.4px solid rgba(214,168,74,.5);"><div style="position:absolute; left:50%; top:54%; width:11px; height:16px; border-radius:50% 50% 50% 50% / 64% 64% 36% 36%; background:radial-gradient(circle at 50% 70%, #ffe9b0, #f0b94e 55%, #d4781e); box-shadow:0 0 12px rgba(240,185,78,.85); animation:flick 1.6s ease-in-out infinite;"></div></div>'
      +     '</div>'
      +     '<div style="flex:1;"><div style="font-weight:700; font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:#c9a456;">Pour ouvrir la porte</div><div style="margin-top:3px; font-family:\'Fraunces\',serif; font-weight:600; font-size:16px; color:#fbf3e2;">'+esc(cur.gate || 'Avance vers le Coffre')+'</div></div>'
      +   '</div>'
      +   '<button data-act="doIt" style="margin-top:11px; width:100%; padding:16px; border:none; border-radius:16px; cursor:pointer; font-weight:800; font-size:15px; color:#1c1206; background:linear-gradient(180deg, #f2cd72, #d6a84a); box-shadow:0 12px 28px rgba(214,168,74,.3), 0 0 0 1px rgba(255,255,255,.18) inset;">J\'ai franchi la porte ✓</button>'
      +   '<button data-act="later" style="margin-top:8px; width:100%; padding:9px; border:none; border-radius:12px; cursor:pointer; font-weight:500; font-size:12px; background:transparent; color:#8a6db0;">Plus tard… (la porte se rescelle)</button>'
      + '</div>'
      + '</div>';
  }

  var ACTIONS = { goDoors:goDoors, doIt:doIt, later:later };
  var app=document.getElementById('app');
  app.addEventListener('click', function(ev){
    var el=ev.target.closest('[data-act]'); if(!el) return;
    var a=el.getAttribute('data-act'); if(ACTIONS[a]) ACTIONS[a]();
  });
  function render(){ app.innerHTML = view(); }
  render();
})();
</script>
</body>
</html>
