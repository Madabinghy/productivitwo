workflows:

  # ── iOS — vérification régression (no codesign) ───────────────────────────
  ios-check:
    name: iOS Regression Check
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --no-tree-shake-icons
    publishing:
      email:
        recipients:
          - emeric.edmond@gmail.com
        notify:
          success: true
          failure: true

  # ── Android — release AAB (auto sur push main) ────────────────────────────
  android-release:
    name: Android Release → AAB
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: stable
      android_signing:
        - productivitwo_keystore
      vars:
        PACKAGE_NAME: "com.madabinghy.productivitwo"
    scripts:
      - name: Clean
        script: flutter clean
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --no-tree-shake-icons \
            --build-name=1.0.0 \
            --build-number=1 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERREURS DE BUILD ==="
            grep -E "error:|e: |FAILED|Exception|What went wrong" /tmp/flutter_build.log | head -40
            exit $BUILD_EXIT
          fi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
email:
        recipients:
          - emeric.edmond@gmail.com
        notify:
          success: true
          failure: true
