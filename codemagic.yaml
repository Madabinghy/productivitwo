workflows:

  # ── iOS — TestFlight (déclenchement manuel uniquement) ───────────────────────
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    # ⚠️ CODEMAGIC DÉSACTIVÉ (coûts) — on build iOS sur Xcode Cloud (auto au push).
    # Plus aucun déclenchement automatique : ni push, ni tag. Ce workflow ne peut
    # plus partir que manuellement depuis le dashboard Codemagic (à éviter).
    # triggering:
    #   events:
    #     - tag
    #   tag_patterns:
    #     - pattern: "v*"
    #       include: true
    environment:
      flutter: stable
      groups:
        - ios_credentials        # APP_STORE_CONNECT_PRIVATE_KEY, _KEY_IDENTIFIER, _ISSUER_ID
        - ios_manual_signing     # CERTIFICATE_P12, CERTIFICATE_PASSWORD, PROVISIONING_PROFILE
      vars:
        BUNDLE_ID: "com.madabinghy.productivitwo"
    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Import distribution certificate (P12)
        script: |
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CERTIFICATE_PASSWORD"

      - name: Install provisioning profile
        script: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          install_profile() {
            local VAR_VALUE="$1"
            local TMP_FILE="$2"
            echo "$VAR_VALUE" | base64 --decode > "$TMP_FILE"
            UUID=$(security cms -D -i "$TMP_FILE" 2>/dev/null \
              | plutil -extract UUID raw - 2>/dev/null \
              || grep -o '[0-9A-F]\{8\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{12\}' "$TMP_FILE" | head -1)
            cp "$TMP_FILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
            echo "Profile installé : $UUID"
          }

          # App principale
          install_profile "$PROVISIONING_PROFILE" /tmp/profile.mobileprovision
          # Widget extension
          install_profile "$PROVISIONING_PROFILE_WIDGET" /tmp/profile_widget.mobileprovision

      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles

      - name: Force CocoaPods (désactive Swift Package Manager)
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build IPA
        script: |
          # Offset pour continuer la numérotation depuis Xcode Cloud (dernier build : 309)
          BUILD_NUM=$((BUILD_NUMBER + 309))
          flutter build ipa --release \
            --no-tree-shake-icons \
            --build-number="$BUILD_NUM" \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # « Testeurs productivitwo » est un groupe INTERNE : les builds y sont
        # distribués automatiquement après upload. Assigner un groupe interne via
        # l'API échoue (« Cannot add internal group to a build ») → on ne liste
        # PAS beta_groups ici. (Pour un groupe EXTERNE, il faudrait le remettre.)
      email:
        recipients:
          - emeric.edmond@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS — vérification régression (no codesign, manuel) ──────────────────────
  ios-check:
    name: iOS Regression Check
    max_build_duration: 30
    # Pas de triggering → déclenchement manuel uniquement
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --no-tree-shake-icons
    publishing:
      email:
        recipients:
          - emeric.edmond@gmail.com
        notify:
          success: true
          failure: true

  # ── Android — release AAB → Google Play Beta (manuel) ───────────────────────
  android-release:
    name: Android Release → Google Play Beta
    max_build_duration: 60
    # Pas de triggering → déclenchement manuel depuis Codemagic uniquement
    environment:
      flutter: stable
      android_signing:
        - productivitwo_keystore
      groups:
        - android_credentials   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "com.madabinghy.productivitwo"
    scripts:
      - name: Clean
        script: flutter clean
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --no-tree-shake-icons \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERREURS DE BUILD ==="
            grep -E "error:|e: |FAILED|Exception|What went wrong" /tmp/flutter_build.log | head -40
            exit $BUILD_EXIT
          fi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - emeric.edmond@gmail.com
        notify:
          success: true
          failure: true
